<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PawPoint — Our Team</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
 
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a2a4a;
            color: #f0f0f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
 
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            background-color: #0f1f3d;
            border-bottom: 2px solid #d4a017;
        }
 
        .navbar .logo {
            font-size: 1.4rem;
            font-weight: bold;
            color: #d4a017;
            text-decoration: none;
        }
 
        .navbar .nav-links {
            display: flex;
            align-items: center;
            gap: 16px;
        }
 
        .navbar .nav-links a {
            color: #f0f0f0;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
 
        .navbar .nav-links a:hover {
            color: #d4a017;
        }
 
        .btn-logout {
            background-color: transparent;
            color: #d4a017;
            border: 1px solid #d4a017;
            padding: 6px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: bold;
            transition: background-color 0.2s;
        }
 
        .btn-logout:hover {
            background-color: #d4a017;
            color: #0f1f3d;
        }
 
        /* Banner */
        .banner {
            background-color: #d4a017;
            padding: 50px 24px;
        }
 
        .banner h1 {
            font-size: 2.4rem;
            color: #0f1f3d;
            max-width: 900px;
            margin: 0 auto;
        }
 
        .banner p {
            font-size: 0.9rem;
            color: #0f1f3d;
            opacity: 0.7;
            max-width: 900px;
            margin: 6px auto 0;
        }
 
        /* Team section */
        .team-section {
            background-color: #f5f5f5;
            flex: 1;
            padding: 50px 24px 60px;
        }
 
        .team-grid {
            display: flex;
            justify-content: center;
            gap: 32px;
            flex-wrap: wrap;
            max-width: 1000px;
            margin: 0 auto;
        }
 
        .member-card {
            width: 220px;
            text-align: left;
        }
 
        .member-photo {
            width: 220px;
            height: 240px;
            background-color: #ddd;
            margin-bottom: 18px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
 
        .member-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
 
        .member-photo .placeholder {
            font-size: 4rem;
            color: #bbb;
        }
 
        .member-card h3 {
            font-size: 0.95rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #1a1a1a;
            margin-bottom: 4px;
        }
 
        .member-card .role {
            font-size: 0.8rem;
            color: #d4a017;
            font-style: italic;
            margin-bottom: 12px;
        }
 
        .member-card .bio {
            font-size: 0.8rem;
            color: #666;
            line-height: 1.6;
            margin-bottom: 16px;
        }
 
        .socials {
            display: flex;
            gap: 12px;
        }
 
        .socials a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-color: #333;
            transition: background-color 0.2s;
        }
 
        .socials a:hover {
            background-color: #d4a017;
        }
 
        .socials a svg {
            width: 14px;
            height: 14px;
            fill: #fff;
        }
    </style>
</head>
